[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "polylang"
version = "1.0.0"
description = "Multilingual RAG with hybrid (dense + BM25) retrieval and a cross-lingual semantic cache."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Valentina Kiyungi" }]
requires-python = ">=3.10"
keywords = ["rag", "semantic-cache", "multilingual", "bm25", "fastapi", "swahili", "embeddings"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Framework :: FastAPI",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "numpy>=1.24",
  "pydantic>=2.0",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "python-multipart>=0.0.9",
  "sentence-transformers>=2.6",
]

[project.optional-dependencies]
files = ["pypdf>=4.0", "python-docx>=1.1"]
dev = ["pytest>=8.0", "httpx>=0.27", "ruff>=0.5"]

[project.scripts]
polylang = "polylang.cli:main"

[project.urls]
Repository = "https://github.com/valentinakiyungi/polylang"

[tool.setuptools.packages.find]
include = ["polylang*"]

[tool.setuptools.package-data]
polylang = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]
