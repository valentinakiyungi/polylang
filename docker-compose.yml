services:
  polylang:
    build: .
    image: polylang:latest
    ports:
      - "8001:8001"
    env_file:
      - path: .env
        required: false
    environment:
      POLYLANG_DATA_DIR: /app/storage
    volumes:
      - polylang-storage:/app/storage
    restart: unless-stopped

  # Optional local LLM. Start with: docker compose --profile ollama up
  # then set POLYLANG_LLM_PROVIDER=ollama and POLYLANG_LLM_BASE_URL=http://ollama:11434 in .env
  ollama:
    image: ollama/ollama:latest
    profiles: ["ollama"]
    volumes:
      - ollama-models:/root/.ollama
    ports:
      - "11434:11434"

volumes:
  polylang-storage:
  ollama-models:
